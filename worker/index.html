<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a1a0a" />
  <title>Pinnacles â€” Worker Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/worker.css" />
</head>
<body>

<!-- â”€â”€ LOGIN â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
<div id="w-login">
  <div class="w-login-box">
    <div style="margin-bottom:14px"><img src="../images/receipt-logo.jpg" alt="Pinnacles Logo" style="width:80px;height:auto;border-radius:10px;object-fit:contain" /></div>
    <h1>Pinnacles Farm</h1>
    <p>Worker Portal</p>

    <!-- Tabs -->
    <div style="display:flex;border-bottom:1px solid rgba(255,255,255,.12);margin:16px 0 20px">
      <button id="tab-login-btn" onclick="wSwitchTab('login')" style="flex:1;background:none;border:none;color:#52b788;font-weight:700;font-size:.9rem;padding:8px 0;border-bottom:2px solid #52b788;cursor:pointer;font-family:inherit">Sign In</button>
      <button id="tab-reg-btn"   onclick="wSwitchTab('reg')"   style="flex:1;background:none;border:none;color:rgba(255,255,255,.4);font-weight:600;font-size:.9rem;padding:8px 0;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="w-tab-login">
      <div id="w-err" class="w-err" style="display:none"></div>
      <input type="email"    id="we" placeholder="Your email address" autocomplete="email" />
      <input type="password" id="wp" placeholder="Password"           autocomplete="current-password" onkeydown="if(event.key==='Enter')wLogin()" />
      <button onclick="wLogin()">Sign In &#x1F91D;</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="w-tab-reg" style="display:none">
      <div id="w-reg-err" class="w-err" style="display:none"></div>
      <input type="text"     id="wr-name"  placeholder="Your full name *"                     autocomplete="name" />
      <input type="email"    id="wr-email" placeholder="Email address *"                      autocomplete="email" />
      <input type="tel"      id="wr-phone" placeholder="Phone number" />
      <input type="text"     id="wr-role"  placeholder="Your job (e.g. Field Worker, Driver)" />
      <input type="password" id="wr-pass"  placeholder="Choose a password *"                  autocomplete="new-password" />
      <input type="password" id="wr-pass2" placeholder="Confirm password *"                   autocomplete="new-password" onkeydown="if(event.key==='Enter')wRegister()" />
      <button onclick="wRegister()" style="background:linear-gradient(135deg,#1b4332,#2d6a4f)">Submit Registration &#x1F331;</button>
      <p style="font-size:.75rem;color:rgba(255,255,255,.35);margin-top:12px;line-height:1.5;text-align:center">Your account will be reviewed and activated by the farm manager before you can log in.</p>
    </div>
  </div>
</div>

<!-- â”€â”€ MAIN APP â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
<div id="w-app" style="display:none">

  <header class="w-header"><img src="../images/receipt-logo.jpg" alt="Pinnacles" style="height:38px;width:auto;border-radius:6px;object-fit:contain;flex-shrink:0" /><div>
      <div class="w-greeting" id="w-greeting">Good morning!</div>
      <div class="w-date"     id="w-date"></div>
    </div>
    <button class="w-logout" onclick="wLogout()">Sign Out</button>
  </header>

  <main class="w-main">

    <!-- ATTENDANCE / CLOCK IN â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
    <div id="wtab-attendance" class="w-tab active">
      <div class="w-card">
        <h2>âœ… Clock In / Attendance</h2>
        <div class="w-field">
          <label>Date</label>
          <input type="date" id="wa-date" class="w-input" />
        </div>
        <div class="w-row">
          <div class="w-field">
            <label>Time In</label>
            <input type="time" id="wa-in" class="w-input" />
          </div>
          <div class="w-field">
            <label>Time Out</label>
            <input type="time" id="wa-out" class="w-input" />
          </div>
        </div>
        <div class="w-field">
          <label>Task Today</label>
          <input id="wa-task" class="w-input" placeholder="What are you working on?" />
        </div>
        <div class="w-field">
          <label>Notes</label>
          <textarea id="wa-notes" class="w-input" rows="2" placeholder="Any observations or reports..."></textarea>
        </div>
        <button class="w-btn" onclick="wSubmitAttendance()">âœ… Submit Attendance</button>
      </div>

      <div class="w-card" style="margin-top:14px">
        <h3 style="font-size:.85rem;color:rgba(255,255,255,.55);margin-bottom:12px">My Recent Attendance</h3>
        <div id="w-my-att"><p class="w-empty">Loading...</p></div>
      </div>
    </div>

    <!-- TASKS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
    <div id="wtab-tasks" class="w-tab">
      <div class="w-card">
        <h2>ðŸ“‹ Log a Task</h2>
        <div class="w-field">
          <label>Date</label>
          <input type="date" id="wt-date" class="w-input" />
        </div>
        <div class="w-field">
          <label>Category</label>
          <select id="wt-cat" class="w-input">
            <option>Planting</option>
            <option>Watering</option>
            <option>Weeding</option>
            <option>Harvesting</option>
            <option>Spraying</option>
            <option>Maintenance</option>
            <option>Feeding</option>
            <option>Cleaning</option>
            <option>General</option>
          </select>
        </div>
        <div class="w-field">
          <label>Task Description *</label>
          <textarea id="wt-desc" class="w-input" rows="4"
                    placeholder="Describe what you did in detail..."></textarea>
        </div>
        <div class="w-field">
          <label>Field / Area</label>
          <input id="wt-area" class="w-input" placeholder="e.g. Block A, Greenhouse, Poultry House" />
        </div>
        <button class="w-btn" onclick="wSubmitTask()">ðŸ“‹ Log Task</button>
      </div>
    </div>

    <!-- HARVEST â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
    <div id="wtab-harvest" class="w-tab">
      <div class="w-card">
        <h2>ðŸ§º Log a Harvest</h2>
        <div class="w-field">
          <label>Crop Name *</label>
          <input id="wh-crop" class="w-input" placeholder="e.g. Tomatoes, Peppers, Eggs" />
        </div>
        <div class="w-field">
          <label>Harvest Date</label>
          <input type="date" id="wh-date" class="w-input" />
        </div>
        <div class="w-row">
          <div class="w-field">
            <label>Quantity *</label>
            <input type="number" id="wh-qty" class="w-input" placeholder="0" step="0.1" min="0" />
          </div>
          <div class="w-field">
            <label>Unit</label>
            <select id="wh-unit" class="w-input">
              <option>kg</option>
              <option>basket</option>
              <option>crate</option>
              <option>bag</option>
              <option>bunch</option>
              <option>pieces</option>
            </select>
          </div>
        </div>
        <div class="w-field">
          <label>Quality</label>
          <select id="wh-grade" class="w-input">
            <option value="A">A â€” Excellent</option>
            <option value="B">B â€” Good</option>
            <option value="C">C â€” Fair</option>
          </select>
        </div>
        <div class="w-field">
          <label>Notes / Observations</label>
          <textarea id="wh-notes" class="w-input" rows="2"
                    placeholder="Any issues, pests, damage, etc."></textarea>
        </div>
        <button class="w-btn" onclick="wSubmitHarvest()">ðŸ§º Submit Harvest</button>
      </div>
    </div>

    <!-- DIARY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
    <div id="wtab-diary" class="w-tab">
      <div class="w-card">
        <h2>ðŸ“” Daily Diary</h2>
        <div class="w-field">
          <label>Date</label>
          <input type="date" id="wd-date" class="w-input" />
        </div>
        <div class="w-field">
          <label>What happened today? *</label>
          <textarea id="wd-note" class="w-input" rows="6"
                    placeholder="Write your farm diary entry â€” tasks completed, observations, issues, progress..."></textarea>
        </div>
        <div class="w-field">
          <label>Weather</label>
          <input id="wd-weather" class="w-input" placeholder="e.g. Sunny 32Â°C, Rainy, Cloudy" />
        </div>
        <button class="w-btn" onclick="wSubmitDiary()">ðŸ“” Save Entry</button>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAV â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
  <nav class="w-nav">
    <button class="w-nav-btn active" onclick="wTab('attendance',this)">âœ…<span>Clock In</span></button>
    <button class="w-nav-btn"        onclick="wTab('tasks',this)">ðŸ“‹<span>Tasks</span></button>
    <button class="w-nav-btn"        onclick="wTab('harvest',this)">ðŸ§º<span>Harvest</span></button>
    <button class="w-nav-btn"        onclick="wTab('diary',this)">ðŸ“”<span>Diary</span></button>
  </nav>

</div><!-- /#w-app -->

<div id="w-toast" class="w-toast" style="display:none"></div>

<script src="js/worker.js"></script>
</body>
</html>
